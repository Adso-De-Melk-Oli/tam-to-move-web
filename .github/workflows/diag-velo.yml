name: Diagnostic Vélomagg
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          curl -sSL -o gbfs.json https://gbfs.theta.fifteen.eu/gbfs/montpellier/gbfs.json
          cat gbfs.json | head -c 3000 > gbfs-head.txt
          for u in $(python3 -c "import json;d=json.load(open('gbfs.json'));f=(d['data'].get('fr') or d['data'].get('en') or list(d['data'].values())[0])['feeds'];print(' '.join(x['name']+'='+x['url'] for x in f))"); do
            n=${u%%=*}; url=${u#*=}; curl -sSL -o "$n.json" "$url" -w "$n %{http_code} %{size_download}\n" >> sizes.txt
          done
          curl -sSI https://gbfs.theta.fifteen.eu/gbfs/montpellier/gbfs.json | grep -i "access-control\|content-type" > cors.txt || true
          git init -q && git checkout -q -b diag-velo && git add . && git -c user.name=ci -c user.email=ci@x commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-velo
