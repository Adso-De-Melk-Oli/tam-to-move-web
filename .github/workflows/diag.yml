name: Diagnostic GTFS
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: En-têtes du GTFS (téléchargement conditionnel ?)
        run: |
          for u in GTFS.zip TripUpdate.pb VehiclePosition.pb Alert.pb; do
            echo "== $u"; curl -sS -o /tmp/f -D /tmp/h "https://gtfsproxy.e-tam.fr/COMMON/$u"; grep -iE "^(HTTP|etag|last-modified|content-length|cache-control|content-encoding)" /tmp/h; echo "octets: $(stat -c %s /tmp/f)"
          done
          E=$(grep -i '^etag' /tmp/h0 2>/dev/null | cut -d' ' -f2- | tr -d '\r')
          curl -sS -o /dev/null -D /tmp/h0 https://gtfsproxy.e-tam.fr/COMMON/GTFS.zip
          E=$(grep -i '^etag' /tmp/h0 | cut -d' ' -f2- | tr -d '\r'); M=$(grep -i '^last-modified' /tmp/h0 | cut -d' ' -f2- | tr -d '\r')
          echo "== conditionnel ETag=[$E] LM=[$M]"
          for u in GTFS.zip TripUpdate.pb; do curl -sS -o /dev/null -H "Accept-Encoding: gzip" -w "gzip $u : code=%{http_code} octets=%{size_download}\n" "https://gtfsproxy.e-tam.fr/COMMON/$u"; done
          curl -sS -o /dev/null -w "code=%{http_code} octets=%{size_download}\n" ${E:+-H "If-None-Match: $E"} ${M:+-H "If-Modified-Since: $M"} https://gtfsproxy.e-tam.fr/COMMON/GTFS.zip
      - run: |
          curl -sSL -o /tmp/g.zip https://gtfsproxy.e-tam.fr/COMMON/GTFS.zip
          python3 scripts/build_data.py /tmp/out /tmp/g.zip > /dev/null
          python3 scripts/diag.py /tmp/g.zip /tmp/out/catalog.json > /tmp/diag.txt 2>&1 || true
          cd /tmp && git init -q o && cp diag.txt o/ && cd o && git checkout -q -b diag && git add . && git -c user.name=ci -c user.email=ci@x commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
